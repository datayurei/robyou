name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.15.0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build-gui:
    name: GUI ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
            # Ubuntu 24.04 ships webkit2gtk 4.1 only.
            tags: webkit2_41
          - name: windows-amd64
            runner: windows-latest
            platform: windows/amd64
            tags: ""
          - name: darwin-universal
            runner: macos-latest
            platform: darwin/universal
            tags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        shell: bash
        run: |
          args=(build -platform "${{ matrix.platform }}" -clean -skipbindings)
          if [ -n "${{ matrix.tags }}" ]; then
            args+=(-tags "${{ matrix.tags }}")
          fi
          wails "${args[@]}"

      # upload-artifact re-zips what it is given and drops the executable
      # bit on the way, which leaves the Linux binary unrunnable and breaks a
      # macOS .app bundle outright. Archiving first preserves the modes and
      # the bundle layout; a Windows .exe needs neither, so it goes as is.
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        env:
          NAME: robyou-gui-${{ matrix.name }}
        run: |
          mkdir -p dist
          tar -czf "dist/${NAME}.tar.gz" -C build/bin .

      - name: Stage Windows build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/* dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: robyou-gui-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  build-cli:
    name: CLI ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY_NAME: robyou-cli_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${BINARY_NAME}" ./cmd/robyou-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: robyou-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
