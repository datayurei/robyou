name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string
      release_name:
        description: Release name. Defaults to the tag when empty.
        required: false
        type: string
      prerelease:
        description: Mark this release as a prerelease.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  WAILS_VERSION: v2.15.0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

  build-gui:
    name: GUI ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
            tags: webkit2_41
          - name: windows-amd64
            runner: windows-latest
            platform: windows/amd64
            tags: ""
          - name: darwin-universal
            runner: macos-latest
            platform: darwin/universal
            tags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        shell: bash
        run: |
          args=(build -platform "${{ matrix.platform }}" -clean -skipbindings)
          if [ -n "${{ matrix.tags }}" ]; then
            args+=(-tags "${{ matrix.tags }}")
          fi
          wails "${args[@]}"

      - name: Package
        shell: bash
        env:
          NAME: robyou_${{ matrix.name }}
        run: |
          mkdir -p "dist/${NAME}"
          cp -R build/bin/* "dist/${NAME}/"
          cp README.md LICENSE "dist/${NAME}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${NAME}.zip" "${NAME}"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            zip -r "${NAME}.zip" "${NAME}"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: robyou-gui-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  build-cli:
    name: CLI ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY_NAME: robyou-cli${{ matrix.ext }}
        run: |
          mkdir -p "dist/robyou-cli_${GOOS}_${GOARCH}"
          go build -trimpath -ldflags="-s -w" -o "dist/robyou-cli_${GOOS}_${GOARCH}/${BINARY_NAME}" ./cmd/robyou-cli
          cp README.md LICENSE "dist/robyou-cli_${GOOS}_${GOARCH}/"

      - name: Package tarball
        if: matrix.archive == 'tar.gz'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd dist
          tar -czf "robyou-cli_${GOOS}_${GOARCH}.tar.gz" "robyou-cli_${GOOS}_${GOARCH}"

      - name: Package zip
        if: matrix.archive == 'zip'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd dist
          zip -r "robyou-cli_${GOOS}_${GOARCH}.zip" "robyou-cli_${GOOS}_${GOARCH}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: robyou-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: [build-gui, build-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ -z "${RELEASE_NAME}" ]; then
            RELEASE_NAME="${TAG}"
          fi

          args=(
            release create "${TAG}"
            release-assets/*
            --title "${RELEASE_NAME}"
            --generate-notes
            --target "${GITHUB_SHA}"
          )

          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
